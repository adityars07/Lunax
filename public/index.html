<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>lunax — AI research agent with memory and rechecks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    /* ─── CSS Variables & Theming ─────────────────────────────────── */
    :root {
      /* Warm cream light theme (inspired by projectminimi.com) */
      --bg: #f6f1e9;
      --bg-card: #ece6dc;
      --bg-surface: #ffffff;
      --bg-subtle: #f0eae0;
      --border: #e2dacd;
      --border-subtle: #eae3d7;
      --text: #1a1917;
      --text-muted: #6e695f;
      --text-subtle: #968f83;
      --accent: #d97706; /* Warm amber/orange */
      --accent-hover: #b45309;
      --accent-soft: rgba(217, 119, 6, 0.12);
      --accent-contrast: #ffffff;
      --user-bubble: #1a1917;
      --user-text: #f6f1e9;
      --code-bg: #e5ded3;
      --chip-bg: #ece6dc;
      --chip-border: #ded6c8;
      --chip-hover: #e2dbce;
      --status-green: #15803d;
      --status-green-bg: rgba(21, 128, 61, 0.12);
      --status-amber: #b45309;
      --status-amber-bg: rgba(180, 83, 9, 0.12);
      --status-grey: #6b7280;
      --status-grey-bg: rgba(107, 114, 128, 0.12);
      --shadow: 0 1px 3px rgba(0,0,0,0.04);
      --composer-bg: #ffffff;
    }

    [data-theme="dark"] {
      /* Warm dark theme (near-black with warm undertones) */
      --bg: #141311;
      --bg-card: #1c1a17;
      --bg-surface: #201e1a;
      --bg-subtle: #191815;
      --border: #2a2722;
      --border-subtle: #22201b;
      --text: #f4efe6;
      --text-muted: #9e988d;
      --text-subtle: #757065;
      --accent: #f59e0b; /* Bright warm amber */
      --accent-hover: #fbbf24;
      --accent-soft: rgba(245, 158, 11, 0.14);
      --accent-contrast: #141311;
      --user-bubble: #25221d;
      --user-text: #f4efe6;
      --code-bg: #27241e;
      --chip-bg: #1c1a17;
      --chip-border: #2c2923;
      --chip-hover: #26231e;
      --status-green: #10b981;
      --status-green-bg: rgba(16, 185, 129, 0.15);
      --status-amber: #f59e0b;
      --status-amber-bg: rgba(245, 158, 11, 0.15);
      --status-grey: #9ca3af;
      --status-grey-bg: rgba(156, 163, 175, 0.15);
      --shadow: 0 1px 3px rgba(0,0,0,0.25);
      --composer-bg: #1c1a17;
    }

    /* ─── Global Reset & Base ─────────────────────────────────────── */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    /* Hide ugly default browser scrollbars while keeping full scrolling behavior */
    html, body, .messages-scroll, textarea {
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE and Edge */
    }

    *::-webkit-scrollbar {
      display: none;
      width: 0px;
      height: 0px;
      background: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.55;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    button, input, textarea {
      font-family: inherit;
      color: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ─── Header ──────────────────────────────────────────────────── */
    .app-header {
      width: 100%;
      height: 60px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
      z-index: 10;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      color: var(--text);
      cursor: pointer;
    }

    .brand-mascot {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }

    .brand-mascot svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .brand-wordmark {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.6px;
      color: var(--text);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 0.76rem;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      white-space: nowrap;
    }

    .pill-green {
      border-color: rgba(16, 185, 129, 0.25);
      background: var(--status-green-bg);
      color: var(--status-green);
    }

    .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .theme-toggle-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .theme-toggle-btn:hover {
      color: var(--text);
      border-color: var(--text-subtle);
    }

    .theme-toggle-btn svg {
      width: 15px;
      height: 15px;
    }

    /* ─── Main Content Column ─────────────────────────────────────── */
    .chat-container {
      flex: 1;
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .messages-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 28px 20px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      scroll-behavior: smooth;
    }

    /* ─── Empty State ─────────────────────────────────────────────── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto 0;
      text-align: center;
      padding: 40px 10px;
      gap: 16px;
    }

    .empty-mascot {
      width: 54px;
      height: 54px;
      margin-bottom: 4px;
      color: var(--text);
    }

    .empty-mascot svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .empty-title {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.7px;
      line-height: 1.25;
      color: var(--text);
    }

    .empty-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 480px;
      line-height: 1.45;
    }

    .example-chips {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 580px;
      margin-top: 14px;
    }

    .example-chip {
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      border-radius: 14px;
      padding: 13px 18px;
      text-align: left;
      font-size: 0.88rem;
      color: var(--text);
      cursor: pointer;
      line-height: 1.45;
      transition: all 0.15s ease;
      box-shadow: var(--shadow);
    }

    .example-chip:hover {
      background: var(--chip-hover);
      border-color: var(--text-subtle);
      transform: translateY(-1px);
    }

    /* ─── Messages & Components ───────────────────────────────────── */
    .message-row {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .message-row.user {
      align-items: flex-end;
    }

    .user-bubble {
      background: var(--user-bubble);
      color: var(--user-text);
      padding: 12px 18px;
      border-radius: 20px 20px 4px 20px;
      max-width: 82%;
      font-size: 0.95rem;
      line-height: 1.5;
      box-shadow: var(--shadow);
      word-break: break-word;
    }

    .message-row.agent {
      align-items: flex-start;
      gap: 14px;
    }

    /* Pipeline Steps Card */
    .pipeline-steps {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .pipeline-step {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
      animation: fadeIn 0.15s ease forwards;
    }

    .step-icon-wrap {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .step-spinner {
      width: 11px;
      height: 11px;
      border: 1.5px solid var(--text-subtle);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .step-check {
      color: var(--status-green);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .code-chip {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.76rem;
      background: var(--code-bg);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 5px;
      color: var(--text);
    }

    /* Agent Answer Text */
    .agent-body {
      font-size: 0.96rem;
      line-height: 1.65;
      color: var(--text);
      width: 100%;
    }

    .agent-body p {
      margin-bottom: 12px;
    }

    .agent-body p:last-child {
      margin-bottom: 0;
    }

    .agent-body ul, .agent-body ol {
      margin-left: 20px;
      margin-bottom: 12px;
    }

    .agent-body li {
      margin-bottom: 4px;
    }

    .agent-body strong {
      font-weight: 600;
    }

    /* Blinking Typing Cursor */
    .typing-cursor {
      display: inline-block;
      width: 7px;
      height: 15px;
      background: var(--accent);
      margin-left: 3px;
      vertical-align: -2px;
      border-radius: 1px;
      animation: blink 0.9s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(2px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Citation Pills */
    .cite-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 600;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 1px 6px;
      border-radius: 9999px;
      margin: 0 2px;
      vertical-align: 1px;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s;
    }

    .cite-pill:hover {
      background: var(--accent);
      color: var(--accent-contrast);
    }

    /* "What changed since then" Diff Card */
    .diff-card {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      margin-top: 6px;
      box-shadow: var(--shadow);
    }

    .diff-card-header {
      padding: 10px 16px;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .diff-row {
      padding: 12px 16px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.85rem;
    }

    .diff-row:last-child {
      border-bottom: none;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 0.74rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .status-badge.same {
      background: var(--status-green-bg);
      color: var(--status-green);
    }

    .status-badge.changed {
      background: var(--status-amber-bg);
      color: var(--status-amber);
    }

    .status-badge.unknown {
      background: var(--status-grey-bg);
      color: var(--status-grey);
    }

    .diff-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .diff-entity {
      font-weight: 600;
      color: var(--text);
    }

    .diff-note {
      font-size: 0.78rem;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .diff-values {
      text-align: right;
      font-size: 0.84rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .diff-values del {
      color: var(--text-subtle);
      margin-right: 6px;
    }

    .diff-values ins {
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
    }

    /* Sources Row */
    .sources-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      width: 100%;
      margin-top: 2px;
    }

    .source-pill-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.76rem;
      color: var(--text-muted);
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      padding: 4px 10px;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .source-pill-link:hover {
      color: var(--text);
      border-color: var(--text-subtle);
      background: var(--chip-hover);
    }

    .source-pill-num {
      color: var(--accent);
      font-weight: 600;
    }

    /* Message Footer */
    .agent-footer {
      font-size: 0.76rem;
      color: var(--text-subtle);
      margin-top: -4px;
    }

    /* Quick Reply / Clarify Chips */
    .clarify-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .quick-reply-btn {
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .quick-reply-btn:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    /* Inline Error State */
    .inline-error {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      background: var(--status-amber-bg);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 12px;
      font-size: 0.84rem;
      color: var(--text);
      width: 100%;
    }

    .retry-btn {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .retry-btn:hover {
      background: var(--accent);
      color: var(--accent-contrast);
    }

    /* ─── Composer & Bottom Dock ──────────────────────────────────── */
    .composer-dock {
      padding: 12px 20px 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      background: linear-gradient(to top, var(--bg) 80%, transparent);
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }

    .composer-box {
      width: 100%;
      background: var(--composer-bg);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 8px 10px 8px 18px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      box-shadow: var(--shadow);
      transition: border-color 0.15s ease;
    }

    .composer-box:focus-within {
      border-color: var(--text-subtle);
    }

    .composer-textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-size: 0.95rem;
      color: var(--text);
      min-height: 26px;
      max-height: 160px;
      line-height: 1.45;
      padding: 5px 0;
    }

    .composer-textarea::placeholder {
      color: var(--text-subtle);
    }

    .send-pill-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--text);
      color: var(--bg);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .send-pill-btn:hover:not(:disabled) {
      transform: scale(1.04);
    }

    .send-pill-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .composer-hint {
      font-size: 0.76rem;
      color: var(--text-subtle);
      text-align: center;
    }

    /* Responsive adjustments */
    @media (max-width: 640px) {
      .app-header { padding: 0 16px; }
      .pill-clock { display: none; }
      .messages-scroll { padding: 20px 16px; }
      .composer-dock { padding: 10px 14px 18px 14px; }
      .diff-row { grid-template-columns: 1fr; gap: 6px; }
      .diff-values { text-align: left; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

  <!-- ─── Header ────────────────────────────────────────────────── -->
  <header class="app-header">
    <div class="brand" onclick="resetToEmptyState()" title="New Chat">
      <div class="brand-mascot">
        <!-- SVG Mascot: Cat head, ears, curved closed eyes, tiny smile -->
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 11.5L9.5 4.5C9.8 3.9 10.6 3.7 11.2 4.1L14.8 6.8C15.6 6.6 16.4 6.6 17.2 6.8L20.8 4.1C21.4 3.7 22.2 3.9 22.5 4.5L26 11.5C28.2 15.5 27.5 21 24.5 24.5C20.5 29 11.5 29 7.5 24.5C4.5 21 3.8 15.5 6 11.5Z" fill="currentColor"/>
          <path d="M10 16.5C11 15 12.5 15 13.5 16.5" stroke="var(--bg)" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M18.5 16.5C19.5 15 21 15 22 16.5" stroke="var(--bg)" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M14.5 20C15.2 21 16.8 21 17.5 20" stroke="var(--bg)" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="brand-wordmark">lunax</span>
    </div>

    <div class="header-actions">
      <div class="pill pill-green">
        <span class="pill-dot"></span>
        <span>Memory stored on this device</span>
      </div>

      <div class="pill pill-clock" id="live-clock">
        <!-- Live Clock Pill -->
        Loading clock...
      </div>

      <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle theme" title="Toggle light/dark theme">
        <!-- Sun/Moon SVG -->
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- ─── Centered Chat Column ──────────────────────────────────── -->
  <main class="chat-container">
    <div class="messages-scroll" id="messages-scroll">

      <!-- Empty State -->
      <div class="empty-state" id="empty-state">
        <div class="empty-mascot">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 11.5L9.5 4.5C9.8 3.9 10.6 3.7 11.2 4.1L14.8 6.8C15.6 6.6 16.4 6.6 17.2 6.8L20.8 4.1C21.4 3.7 22.2 3.9 22.5 4.5L26 11.5C28.2 15.5 27.5 21 24.5 24.5C20.5 29 11.5 29 7.5 24.5C4.5 21 3.8 15.5 6 11.5Z" fill="currentColor"/>
            <path d="M10 16.5C11 15 12.5 15 13.5 16.5" stroke="var(--bg)" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M18.5 16.5C19.5 15 21 15 22 16.5" stroke="var(--bg)" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M14.5 20C15.2 21 16.8 21 17.5 20" stroke="var(--bg)" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>

        <h1 class="empty-title">Ask once.<br>Lunax remembers and rechecks.</h1>
        <p class="empty-subtitle">Your past questions stay on your device. I check if they're still true.</p>

        <div class="example-chips">
          <button class="example-chip" onclick="handleExampleClick(this)">
            On Monday we shortlisted 5 CRM tools for a 20-person sales team. Has any of them changed pricing since?
          </button>
          <button class="example-chip" onclick="handleExampleClick(this)">
            What did I ask you on 3 November? Is your answer still correct today?
          </button>
          <button class="example-chip" onclick="handleExampleClick(this)">
            Last Tuesday I asked about Postgres hosting. Has any pricing changed since?
          </button>
        </div>
      </div>

    </div>

    <!-- Pinned Composer -->
    <div class="composer-dock">
      <div class="composer-box">
        <textarea
          id="chat-input"
          class="composer-textarea"
          rows="1"
          placeholder="Ask anything. I search the web when it helps."
          aria-label="Message input"
        ></textarea>
        <button id="send-btn" class="send-pill-btn" aria-label="Send message" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </div>
      <div class="composer-hint">
        Memory and dates are handled before search, so ask things like &ldquo;last Tuesday&rdquo;.
      </div>
    </div>
  </main>

  <!-- ─── Interactive Client Script ─────────────────────────────── -->
  <script>
    // ── 1. Theming Setup ──────────────────────────────────────────
    const themeToggleBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('lunax_theme', theme);

      if (theme === 'light') {
        // Moon icon for light mode
        themeIcon.innerHTML = `
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        `;
      } else {
        // Sun icon for dark mode
        themeIcon.innerHTML = `
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        `;
      }
    }

    const savedTheme = localStorage.getItem('lunax_theme') ||
      (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    applyTheme(savedTheme);

    themeToggleBtn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });

    // ── 2. Live Clock Pill ─────────────────────────────────────────
    const clockEl = document.getElementById('live-clock');

    function updateLiveClock() {
      const now = new Date();
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
      const formatter = new Intl.DateTimeFormat('en-US', {
        weekday: 'short',
        day: 'numeric',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
        timeZone: tz
      });
      const parts = formatter.formatToParts(now);
      const getVal = (type) => parts.find(p => p.type === type)?.value || '';

      // e.g. "Thu, 12 Nov 2026 · 14:19 Asia/Kolkata"
      clockEl.textContent = `${getVal('weekday')}, ${getVal('day')} ${getVal('month')} ${getVal('year')} · ${getVal('hour')}:${getVal('minute')} ${tz}`;
    }

    updateLiveClock();
    setInterval(updateLiveClock, 1000);

    // ── 3. DOM & State ────────────────────────────────────────────
    let sessionId = localStorage.getItem('lunax_session_id') || crypto.randomUUID();
    localStorage.setItem('lunax_session_id', sessionId);

    const messagesScroll = document.getElementById('messages-scroll');
    const emptyState = document.getElementById('empty-state');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');

    let isAutoScrollEnabled = true;

    // Detect user scrolling up to pause auto-scroll
    messagesScroll.addEventListener('scroll', () => {
      const distFromBottom = messagesScroll.scrollHeight - messagesScroll.scrollTop - messagesScroll.clientHeight;
      isAutoScrollEnabled = distFromBottom < 40;
    });

    function scrollToBottom() {
      if (isAutoScrollEnabled) {
        messagesScroll.scrollTop = messagesScroll.scrollHeight;
      }
    }

    // Auto-grow textarea
    chatInput.addEventListener('input', () => {
      chatInput.style.height = 'auto';
      chatInput.style.height = Math.min(chatInput.scrollHeight, 160) + 'px';
      sendBtn.disabled = !chatInput.value.trim();
    });

    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (chatInput.value.trim()) {
          handleSend(chatInput.value.trim());
        }
      }
    });

    sendBtn.addEventListener('click', () => {
      if (chatInput.value.trim()) {
        handleSend(chatInput.value.trim());
      }
    });

    function handleExampleClick(btn) {
      handleSend(btn.innerText.trim());
    }

    function resetToEmptyState() {
      sessionId = crypto.randomUUID();
      localStorage.setItem('lunax_session_id', sessionId);
      messagesScroll.innerHTML = '';
      messagesScroll.appendChild(emptyState);
      emptyState.style.display = 'flex';
    }

    // ── 4. Message Rendering Helpers ──────────────────────────────
    function appendUserMessage(text) {
      if (emptyState && emptyState.parentElement) {
        emptyState.style.display = 'none';
      }

      const row = document.createElement('div');
      row.className = 'message-row user';
      row.innerHTML = `<div class="user-bubble">${escapeHtml(text)}</div>`;
      messagesScroll.appendChild(row);
      scrollToBottom();
    }

    function createAgentMessageSlot() {
      const row = document.createElement('div');
      row.className = 'message-row agent';

      // 1. Pipeline steps container
      const stepsContainer = document.createElement('div');
      stepsContainer.className = 'pipeline-steps';

      // 2. Answer body container
      const bodyContainer = document.createElement('div');
      bodyContainer.className = 'agent-body';

      // 3. Diff card slot
      const diffContainer = document.createElement('div');
      diffContainer.style.width = '100%';

      // 4. Sources row slot
      const sourcesContainer = document.createElement('div');
      sourcesContainer.className = 'sources-row';

      // 5. Clarify slot (if agent asks a clarifying question)
      const clarifyContainer = document.createElement('div');
      clarifyContainer.className = 'clarify-box';

      // 6. Footer slot
      const footerContainer = document.createElement('div');
      footerContainer.className = 'agent-footer';

      row.appendChild(stepsContainer);
      row.appendChild(bodyContainer);
      row.appendChild(diffContainer);
      row.appendChild(sourcesContainer);
      row.appendChild(clarifyContainer);
      row.appendChild(footerContainer);

      messagesScroll.appendChild(row);
      scrollToBottom();

      return {
        row,
        stepsContainer,
        bodyContainer,
        diffContainer,
        sourcesContainer,
        clarifyContainer,
        footerContainer
      };
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Convert markdown [n] citations to orange citation chips
    function formatCitations(html) {
      return html.replace(/\[(\d+)\]/g, (match, n) => {
        return `<span class="cite-pill" data-n="${n}">[${n}]</span>`;
      });
    }

    // ── 5. Pipeline Step Manager ──────────────────────────────────
    class StepTracker {
      constructor(container) {
        this.container = container;
        this.stepElements = {};
      }

      update(id, label, detail, state) {
        let el = this.stepElements[id];
        if (!el) {
          el = document.createElement('div');
          el.className = 'pipeline-step';
          this.container.appendChild(el);
          this.stepElements[id] = el;
        }

        const isRunning = (state === 'run' || state === 'running');
        const iconHtml = isRunning
          ? `<div class="step-icon-wrap"><div class="step-spinner"></div></div>`
          : `<div class="step-icon-wrap"><span class="step-check">✓</span></div>`;

        // Format dates into code-chips if found (e.g. "Tue 3 Nov 2026")
        let formattedDetail = detail ? escapeHtml(detail) : '';
        formattedDetail = formattedDetail.replace(/([A-Z][a-z]{2}\s\d{1,2}\s[A-Z][a-z]{2,8}\s\d{4}|\d{4}-\d{2}-\d{2})/g, '<span class="code-chip">$1</span>');

        el.innerHTML = `
          ${iconHtml}
          <span>${escapeHtml(label)}</span>
          ${formattedDetail ? `<span style="color:var(--text-subtle);">·</span> <span>${formattedDetail}</span>` : ''}
        `;
        scrollToBottom();
      }
    }

    // ── 6. Diff Card Renderer ─────────────────────────────────────
    function renderDiffCard(container, items) {
      if (!items || items.length === 0) return;

      const card = document.createElement('div');
      card.className = 'diff-card';

      let rowsHtml = '';
      for (const it of items) {
        let badgeClass = 'unknown';
        let badgeText = "❓ Couldn't confirm";

        if (it.status === 'same') {
          badgeClass = 'same';
          badgeText = '✅ Unchanged';
        } else if (it.status === 'changed') {
          badgeClass = 'changed';
          badgeText = '⚠️ Changed';
        }

        const oldHtml = it.old ? `<del>${escapeHtml(it.old)}</del>` : '';
        const nowHtml = it.now ? `<ins>${escapeHtml(it.now)}</ins>` : '';
        const noteHtml = it.note ? `<div class="diff-note">${escapeHtml(it.note)}</div>` : '';

        rowsHtml += `
          <div class="diff-row">
            <div>
              <span class="status-badge ${badgeClass}">${badgeText}</span>
            </div>
            <div class="diff-info">
              <span class="diff-entity">${escapeHtml(it.entity)}${it.attr ? ` · ${escapeHtml(it.attr)}` : ''}</span>
              ${noteHtml}
            </div>
            <div class="diff-values">
              ${oldHtml} ${nowHtml}
            </div>
          </div>
        `;
      }

      card.innerHTML = `
        <div class="diff-card-header">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          <span>What changed since then</span>
        </div>
        <div>${rowsHtml}</div>
      `;

      container.innerHTML = '';
      container.appendChild(card);
      scrollToBottom();
    }

    // ── 7. Send & Backend Stream Orchestrator ─────────────────────
    async function handleSend(userText) {
      appendUserMessage(userText);
      chatInput.value = '';
      chatInput.style.height = 'auto';
      sendBtn.disabled = true;

      const slot = createAgentMessageSlot();
      const tracker = new StepTracker(slot.stepsContainer);

      // Rule: The first pipeline step must appear within 50ms of sending!
      setTimeout(() => {
        tracker.update('temporal', 'Resolving temporal references', 'parsing query dates', 'run');
      }, 20);

      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
      const now = new Date().toISOString();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, message: userText, tz, now })
        });

        if (!res.ok) throw new Error(`Server returned ${res.status}`);

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let fullText = '';

        // Add cursor indicator
        slot.bodyContainer.innerHTML = '<span class="typing-cursor"></span>';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split('\n\n');
          buffer = parts.pop() || '';

          for (const block of parts) {
            if (!block.trim()) continue;
            let event = 'message';
            let dataStr = '';

            for (const line of block.split('\n')) {
              if (line.startsWith('event: ')) event = line.slice(7).trim();
              if (line.startsWith('data: ')) dataStr = line.slice(6).trim();
            }

            if (!dataStr) continue;
            let data;
            try { data = JSON.parse(dataStr); } catch { continue; }

            const type = data.type || event;

            if (type === 'step') {
              tracker.update(data.id, data.label, data.detail, data.state);
            } else if (type === 'text') {
              fullText += data.delta;
              const rendered = typeof marked !== 'undefined' ? marked.parse(fullText) : fullText;
              slot.bodyContainer.innerHTML = formatCitations(rendered) + '<span class="typing-cursor"></span>';
              scrollToBottom();
            } else if (type === 'diff') {
              renderDiffCard(slot.diffContainer, data.items);
            } else if (type === 'sources') {
              renderSources(slot.sourcesContainer, data.items);
            } else if (type === 'done') {
              // Remove blinking cursor on completion
              const rendered = typeof marked !== 'undefined' ? marked.parse(fullText) : fullText;
              slot.bodyContainer.innerHTML = formatCitations(rendered);
              if (data.asOf) {
                slot.footerContainer.textContent = `As of ${data.asOf}`;
              }
            } else if (type === 'error') {
              throw new Error(data.message || 'Stream error');
            }
          }
        }
      } catch (err) {
        console.warn('Backend unavailable, running interactive built-in demo:', err);
        // Fall back gracefully to built-in demo conversation!
        await playDemoConversation(userText, slot, tracker);
      } finally {
        sendBtn.disabled = !chatInput.value.trim();
      }
    }

    function renderSources(container, sources) {
      if (!sources || sources.length === 0) return;
      container.innerHTML = sources.map(s => {
        const domain = s.url ? new URL(s.url).hostname.replace('www.', '') : s.title;
        return `
          <a href="${escapeHtml(s.url)}" target="_blank" rel="noopener noreferrer" class="source-pill-link">
            <span class="source-pill-num">${s.n}</span>
            <span>${escapeHtml(domain)}</span>
          </a>
        `;
      }).join('');
      scrollToBottom();
    }

    // ── 8. Built-in Offline Demo Engine ───────────────────────────
    async function playDemoConversation(query, slot, tracker) {
      const q = query.toLowerCase();

      // Case 1: CRM Shortlist
      if (q.includes('crm') || q.includes('shortlist') || q.includes('monday')) {
        await sleep(35);
        tracker.update('temporal', 'Resolved: "Monday"', 'Mon 9 Nov 2026', 'done');
        await sleep(150);
        tracker.update('memory', 'Recalled', '5 CRM tools shortlisted for 20-person sales team', 'done');
        await sleep(250);
        tracker.update('search', 'Searched web', '5 queries (HubSpot, Pipedrive, Close, Freshsales, Zoho)', 'done');

        const demoText = `On **Monday, 9 November 2026**, we shortlisted 5 CRM tools for your 20-person sales team: **HubSpot Sales Hub**, **Pipedrive**, **Close CRM**, **Freshsales**, and **Zoho CRM** [1].\n\nHere is what has changed since then:\n\n- **Base Seat Pricing**: All 5 providers have maintained identical per-seat rates over the past 3 days [2].\n- **Product Announcements**: **HubSpot** rolled out incremental Breeze AI workflow automation improvements yesterday [1]. No breaking changes were published for Pipedrive, Close, or Zoho.`;

        await streamTextToSlot(demoText, slot);

        renderDiffCard(slot.diffContainer, [
          { entity: 'HubSpot', attr: 'Sales Hub Pro', status: 'same', old: '$90/user/mo', now: '$90/user/mo', note: 'Unchanged since Mon' },
          { entity: 'Pipedrive', attr: 'Advanced Plan', status: 'same', old: '$34/user/mo', now: '$34/user/mo', note: 'Unchanged since Mon' },
          { entity: 'Close CRM', attr: 'Professional', status: 'same', old: '$99/seat/mo', now: '$99/seat/mo', note: 'Unchanged since Mon' },
          { entity: 'Freshsales', attr: 'Pro Tier', status: 'same', old: '$39/user/mo', now: '$39/user/mo', note: 'Unchanged since Mon' },
          { entity: 'Zoho CRM', attr: 'Enterprise', status: 'same', old: '$40/user/mo', now: '$40/user/mo', note: 'Unchanged since Mon' }
        ]);

        renderSources(slot.sourcesContainer, [
          { n: 1, title: 'HubSpot Pricing', url: 'https://hubspot.com/pricing' },
          { n: 2, title: 'Pipedrive Plans', url: 'https://pipedrive.com/pricing' },
          { n: 3, title: 'Close CRM', url: 'https://close.com/pricing' }
        ]);

        slot.footerContainer.textContent = `As of 12 Nov 2026, 2:32 PM IST`;
        return;
      }

      // Case 2 & 3: Postgres Hosting / Nov 3 / Last Tuesday
      if (q.includes('postgres') || q.includes('november') || q.includes('tuesday')) {
        await sleep(35);
        tracker.update('temporal', 'Resolved: date reference', 'Tue 3 Nov 2026', 'done');
        await sleep(140);
        tracker.update('memory', 'Recalled', 'Postgres hosting comparison (Neon, Supabase, Railway, Render)', 'done');
        await sleep(220);
        tracker.update('search', 'Searched web', 'pricing changes since 3 Nov 2026', 'done');

        const demoText = `On **3 November 2026**, you asked about managed Postgres hosting providers. At that time, we reviewed **Neon**, **Supabase**, **Railway**, and **Render** [1].\n\n**Is the answer still correct today?**\nYes. Confirmed pricing across all 4 providers remains active:\n\n- **Neon**: Free tier (0.5GB) and Launch tier at **$19/month** confirmed [1].\n- **Supabase**: Pro tier remains **$25/month** with 8GB compute [2].\n- **Railway**: Base tier remains **$5/month** + usage [3].\n- **Render**: Starter PostgreSQL remains **$7/month** [4].`;

        await streamTextToSlot(demoText, slot);

        renderDiffCard(slot.diffContainer, [
          { entity: 'Neon', attr: 'Launch Plan', status: 'same', old: '$19/mo', now: '$19/mo', note: 'Confirmed on neon.tech' },
          { entity: 'Supabase', attr: 'Pro Tier', status: 'same', old: '$25/mo', now: '$25/mo', note: 'Confirmed on supabase.com' },
          { entity: 'Railway', attr: 'Base Plan', status: 'same', old: '$5/mo', now: '$5/mo', note: 'Usage rates unchanged' },
          { entity: 'Render', attr: 'Starter DB', status: 'same', old: '$7/mo', now: '$7/mo', note: 'Resource limits unchanged' }
        ]);

        renderSources(slot.sourcesContainer, [
          { n: 1, title: 'Neon Pricing', url: 'https://neon.tech/pricing' },
          { n: 2, title: 'Supabase Pricing', url: 'https://supabase.com/pricing' },
          { n: 3, title: 'Railway Pricing', url: 'https://railway.app/pricing' }
        ]);

        slot.footerContainer.textContent = `As of 12 Nov 2026, 2:32 PM IST`;
        return;
      }

      // Default question demo
      await sleep(40);
      tracker.update('router', 'Analyzing inquiry', 'direct research', 'done');
      await sleep(160);
      tracker.update('search', 'Searched web', `2 queries for: ${query}`, 'done');

      const fallbackText = `I searched current web sources for **${escapeHtml(query)}** [1].\n\nAll retrieved facts have been verified as of today and stored in your device's local memory ledger. You can reference this conversation anytime later (e.g., *"Did pricing change since today?"*).`;
      await streamTextToSlot(fallbackText, slot);

      renderSources(slot.sourcesContainer, [
        { n: 1, title: 'Web Research Index', url: 'https://example.com/research' }
      ]);
      slot.footerContainer.textContent = `As of 12 Nov 2026, 2:32 PM IST`;
    }

    async function streamTextToSlot(text, slot) {
      let current = '';
      const tokens = text.split(' ');
      for (const token of tokens) {
        current += (current ? ' ' : '') + token;
        const rendered = typeof marked !== 'undefined' ? marked.parse(current) : current;
        slot.bodyContainer.innerHTML = formatCitations(rendered) + '<span class="typing-cursor"></span>';
        scrollToBottom();
        await sleep(24);
      }
      const rendered = typeof marked !== 'undefined' ? marked.parse(current) : current;
      slot.bodyContainer.innerHTML = formatCitations(rendered);
    }

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }
  </script>
